# Dev frontend (Vite + HMR). Source is bind-mounted; the Vite dev-server proxy
# (vite.config.ts) forwards API calls to VITE_API_PROXY_TARGET.
#
#   docker compose -f docker-compose.dev.yml up --build   ->  http://localhost:5173
#
services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: hardening_frontend_dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=${VITE_API_PROXY_TARGET:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - ./tsconfig.json:/app/tsconfig.json
    restart: unless-stopped
