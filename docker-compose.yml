# Production frontend (nginx). Builds the static bundle and reverse-proxies
# /api, /rag, /health, /metrics to the backend. Mirrors the backend repo's
# conventions: restart policy, healthcheck, env-driven config, host-gateway.
#
#   docker compose up -d --build      ->  http://localhost:8080
#
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: os-hardening-frontend:latest
    container_name: hardening_frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      # Where nginx forwards API calls. Point this at your backend.
      # Backend on the host machine: http://host.docker.internal:8000
      # Backend in the same compose network: http://api:8000
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
