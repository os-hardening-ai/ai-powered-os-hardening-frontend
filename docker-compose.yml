services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: os-hardening-frontend:latest
    container_name: hardening_frontend
    ports:
      - "8080:80"
    environment:
      - BACKEND_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
